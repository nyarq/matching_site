<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기숙사 룸메 성향 검사</title>
</head>
<body>

<!-- 시작 화면 -->
<div id="intro">
  <section class="band">
    <div class="inner center">
      <h1>기숙사 룸메 성향 검사</h1>
      <p class="lead">25개 문항에 답하면 나의 기숙사 생활 유형을 알려드려요. 정답은 없으니 평소 모습대로 솔직하게 골라 주세요.</p>
      <div class="row">
        <button class="btn" id="startBtn">검사 시작하기</button>
      </div>
      <p class="note">약 5분 소요 · 결과는 이 브라우저에만 저장돼요</p>
    </div>
  </section>
  <section class="main">
    <div class="inner center">
      <h3>다섯 가지 생활 성향을 알아봐요</h3>
      <div class="dims" id="dimList"></div>
    </div>
  </section>
</div>

<!-- 문항 화면 -->
<section class="main" id="quiz" hidden>
  <div class="inner">
    <div class="progress">
      <div class="meta"><span id="stepName"></span><span id="stepCount"></span></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div id="stepBody"></div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn">이전</button>
      <button class="btn" id="nextBtn">다음</button>
    </div>
  </div>
</section>

<!-- 결과 화면 -->
<div id="result" hidden></div>

<script>
const AXES = [
  { key: "time", name: "생활 시간", color: "var(--c-time)",
    left:  { code: "M", label: "아침형" },
    right: { code: "N", label: "저녁형" },
    desc: { left: "일찍 자고 일찍 일어나는 생활이 몸에 익은 타입이에요. 보통 자정 전에는 잠자리에 들고, 아침 시간을 알차게 쓰는 편이에요. 밤늦게까지 불을 켜거나 키보드를 쓰는 룸메이트와는 소등 시간과 스탠드 사용 여부를 처음에 정해두면 좋아요. 비슷한 아침형 룸메이트와 지내면 생활 리듬이 맞아 훨씬 편해요.",
            right: "밤에 깨어 있는 시간이 길고, 늦은 시간에 집중이 더 잘 되는 타입이에요. 과제나 게임, 영상 시청을 자정 이후까지 하는 날이 많고 아침 일찍 일어나는 건 힘든 편이에요. 일찍 자는 룸메이트와 지낸다면 스탠드와 이어폰을 챙기고, 늦게 움직일 때는 조용히 하는 배려가 필요해요. 비슷한 저녁형 룸메이트와는 서로 눈치 보지 않고 편하게 지낼 수 있어요." } },
  { key: "clean", name: "청결 습관", color: "var(--c-clean)",
    left:  { code: "C", label: "깔끔형" },
    right: { code: "F", label: "여유형" },
    desc: { left: "방이 정리되어 있어야 마음이 편한 타입이에요. 책상이나 바닥에 물건이 나와 있으면 신경이 쓰이고, 청소나 빨래를 미루지 않고 바로 하는 편이에요. 정리 기준이 다른 룸메이트와는 공용 공간 청소 주기와 쓰레기 버리는 날을 미리 정해두면 갈등을 줄일 수 있어요. 비슷하게 깔끔한 룸메이트와 지내면 방을 쾌적하게 유지하기 쉬워요.",
            right: "조금 어질러져 있어도 크게 신경 쓰지 않는 털털한 타입이에요. 청소나 빨래는 쌓이면 한 번에 하는 편이고, 정리보다 편하게 지내는 걸 더 중요하게 생각해요. 깔끔한 룸메이트와 지낸다면 내 자리는 자유롭게 쓰더라도 공용 공간과 쓰레기만큼은 함께 정한 규칙을 지키는 게 좋아요. 비슷하게 여유로운 룸메이트와는 서로 잔소리 없이 편하게 지낼 수 있어요." } },
  { key: "sound", name: "소리", color: "var(--c-sound)",
    left:  { code: "Q", label: "조용형" },
    right: { code: "L", label: "활발형" },
    desc: { left: "소리에 민감해서 조용한 환경을 좋아하는 타입이에요. 작은 소리에도 잠에서 깨기 쉽고, 통화나 알람, 키보드 소리 같은 생활 소음이 신경 쓰이는 편이에요. 방에서 통화하는 시간, 알람 횟수, 스피커 사용 여부를 처음에 룸메이트와 이야기해 두면 좋아요. 비슷하게 조용한 룸메이트와 지내면 편하게 쉬고 잠들 수 있어요.",
            right: "방에서 소리를 내는 일이 많은 활발한 타입이에요. 통화나 영상 통화를 자주 하고, 음악이나 영상을 스피커로 트는 걸 편하게 느끼는 편이에요. 소리에 민감한 룸메이트와 지낸다면 늦은 시간에는 이어폰을 쓰고, 긴 통화는 복도나 휴게실에서 하는 배려가 필요해요. 비슷하게 활발한 룸메이트와는 소리 때문에 서로 눈치 보지 않고 지낼 수 있어요." } },
  { key: "stay", name: "방 사용", color: "var(--c-stay)",
    left:  { code: "H", label: "방순이형" },
    right: { code: "O", label: "외출형" },
    desc: { left: "수업이 없을 때는 주로 방에서 시간을 보내는 타입이에요. 공부, 휴식, 취미까지 방에서 하는 경우가 많아서 방이 편한 쉼터가 되는 게 중요해요. 룸메이트도 방에 오래 있는 편이라면 서로 혼자만의 시간이 필요할 때를 미리 이야기해 두면 좋아요. 밖에서 지내는 시간이 많은 외출형 룸메이트와 지내면 방을 여유롭게 쓸 수 있어요.",
            right: "도서관, 카페, 동아리, 본가 등 밖에서 지내는 시간이 많은 타입이에요. 방은 주로 잠자고 씻는 곳이고, 저녁이나 주말에는 방을 비우는 날이 많은 편이에요. 늦게 들어오는 날에는 룸메이트가 자고 있을 수 있으니 조용히 들어오는 배려가 필요해요. 방에서 혼자 시간을 보내고 싶은 방순이형 룸메이트와 잘 맞아요." } },
  { key: "social", name: "교류", color: "var(--c-social)",
    left:  { code: "I", label: "각자형" },
    right: { code: "T", label: "함께형" },
    desc: { left: "룸메이트와 적당한 거리를 두고 각자 생활하는 게 편한 타입이에요. 인사와 기본적인 배려는 하지만, 밥이나 일정을 꼭 함께할 필요는 없다고 생각해요. 친하게 지내고 싶어 하는 룸메이트와 지낸다면 혼자 있고 싶은 시간을 솔직하게 말해 두면 오해를 줄일 수 있어요. 비슷하게 각자 생활을 존중하는 룸메이트와 지내면 부담 없이 편하게 지낼 수 있어요.",
            right: "룸메이트와 친하게 지내고 싶은 타입이에요. 밥도 같이 먹고 고민 이야기도 나누며, 방에 친구가 잠깐 오는 것도 괜찮다고 생각해요. 혼자 있는 시간을 중요하게 여기는 룸메이트와 지낸다면 상대가 원하는 거리를 존중해 주는 게 좋아요. 비슷하게 함께 어울리길 좋아하는 룸메이트와 지내면 기숙사 생활이 훨씬 즐거워져요." } },
];

// dir: +1 = "그렇다"일수록 오른쪽 성향, -1 = 왼쪽 성향. 축이 섞이도록 순서를 배치
const QUESTIONS = [
  { axis: "time",   dir: -1, text: "평일에는 보통 자정 전에 잠든다." },
  { axis: "clean",  dir: -1, text: "책상이나 바닥에 물건이 나와 있으면 신경이 쓰인다." },
  { axis: "sound",  dir: -1, text: "작은 소리에도 잠에서 쉽게 깬다." },
  { axis: "stay",   dir: -1, text: "수업이 없을 때는 주로 방에서 시간을 보낸다." },
  { axis: "social", dir:  1, text: "룸메이트와 밥을 같이 먹거나 같이 다니면 좋겠다." },

  { axis: "time",   dir:  1, text: "밤늦게 과제하거나 게임할 때 집중이 더 잘 된다." },
  { axis: "clean",  dir: -1, text: "방 청소는 일주일에 두 번 이상 한다." },
  { axis: "sound",  dir:  1, text: "방에서 통화나 영상 통화를 자주 한다." },
  { axis: "stay",   dir:  1, text: "주말에는 본가에 가거나 밖에서 지내는 날이 많다." },
  { axis: "social", dir: -1, text: "방에서는 혼자만의 시간을 갖는 게 중요하다." },

  { axis: "time",   dir: -1, text: "수업이 없는 날에도 오전 9시 전에 일어나는 편이다." },
  { axis: "clean",  dir:  1, text: "빨래나 쓰레기가 며칠 쌓여도 크게 신경 쓰지 않는다." },
  { axis: "sound",  dir:  1, text: "이어폰 없이 스피커로 음악이나 영상을 트는 편이다." },
  { axis: "stay",   dir:  1, text: "방보다 도서관이나 카페에서 공부하는 게 편하다." },
  { axis: "social", dir:  1, text: "룸메이트가 친구를 방에 잠깐 데려와도 괜찮다." },

  { axis: "time",   dir: -1, text: "알람이 울리면 미루지 않고 바로 일어나는 편이다." },
  { axis: "clean",  dir: -1, text: "옷은 입고 나서 바로 옷장이나 옷걸이에 정리한다." },
  { axis: "sound",  dir: -1, text: "키보드나 알람 소리 같은 생활 소음이 신경 쓰인다." },
  { axis: "stay",   dir:  1, text: "약속이나 동아리 활동으로 늦게 들어오는 날이 많다." },
  { axis: "social", dir: -1, text: "룸메이트와는 인사만 하는 사이여도 괜찮다." },

  { axis: "time",   dir:  1, text: "주말에는 늦잠을 자는 편이다." },
  { axis: "clean",  dir:  1, text: "책상 위가 어질러져 있어도 공부하는 데 지장이 없다." },
  { axis: "sound",  dir:  1, text: "조용한 것보다 음악이나 영상 소리가 들리는 게 편하다." },
  { axis: "stay",   dir: -1, text: "하루 중 방에 있는 시간이 가장 길다." },
  { axis: "social", dir:  1, text: "룸메이트와 고민 이야기도 나눌 수 있으면 좋겠다." },
];

const $ = s => document.querySelector(s);

const PER_PAGE = 5;
const QPAGES = Math.ceil(QUESTIONS.length / PER_PAGE);
const TOTAL_STEPS = QPAGES;
// '보통' 없이 6단계: 어느 쪽이든 반드시 기울도록 함
const LIKERT = ["매우 아니다", "아니다", "약간 아니다", "약간 그렇다", "그렇다", "매우 그렇다"];

let state = { answers: {}, info: {}, step: 0 };

function load() { try { const s = JSON.parse(localStorage.getItem("roommate-survey") || "null"); if (s && s.answers) state = Object.assign(state, s); } catch (e) {} }
function save() { try { localStorage.setItem("roommate-survey", JSON.stringify(state)); } catch (e) {} }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function show(id) {
  ["#intro", "#quiz", "#result"].forEach(s => $(s).hidden = (s !== id));
  window.scrollTo(0, 0);
}

function renderIntro() {
  $("#dimList").innerHTML = AXES.map(a => `
    <div class="dim" style="--dc:${a.color}">
      <span class="letters">${a.left.code} · ${a.right.code}</span>
      <b>${a.name}</b>
      <span>${a.left.label} vs ${a.right.label}</span>
    </div>`).join("");
}

function updateBar() {
  const done = Object.keys(state.answers).length + Object.keys(state.info).length;
  $("#barFill").style.width = `${Math.round(done / (QUESTIONS.length) * 100)}%`;
}

function renderStep() {
  $("#stepCount").textContent = `${state.step + 1} / ${TOTAL_STEPS}`;
  $("#prevBtn").textContent = state.step === 0 ? "처음으로" : "이전";
  $("#nextBtn").textContent = state.step === TOTAL_STEPS - 1 ? "결과 보기" : "다음";
  updateBar();

  if (state.step < QPAGES) {
    $("#stepName").textContent = "생활 성향 문항";
    const start = state.step * PER_PAGE;
    const qs = QUESTIONS.slice(start, start + PER_PAGE).map((q, k) => ({ ...q, i: start + k }));
    $("#stepBody").innerHTML = qs.map(q => `
      <div class="q ${state.answers[q.i] ? "done" : ""}" data-q="${q.i}">
        <div class="qtext">${q.text}</div>
        <div class="scale" role="radiogroup" aria-label="${esc(q.text)}">
          <span class="end no">아니다</span>
          <div class="dots">
            ${LIKERT.map((l, v) => `<label title="${l}"><input type="radio" id="q${q.i}-${v}" name="q${q.i}" value="${v + 1}" ${state.answers[q.i] === v + 1 ? "checked" : ""} aria-label="${l}"><span></span></label>`).join("")}
          </div>
          <span class="end yes">그렇다</span>
          <div class="ends-mobile"><span class="no">아니다</span><span class="yes">그렇다</span></div>
        </div>
      </div>`).join("");
  }

  $("#stepBody").querySelectorAll("input[type=radio]").forEach(inp => inp.addEventListener("change", e => {
    const t = e.target, box = t.closest(".q");
    if (t.name.startsWith("q")) state.answers[+t.name.slice(1)] = +t.value;
    else state.info[t.name.slice(2)] = t.value;
    box.classList.remove("missing"); box.classList.add("done");
    save(); updateBar();
    const next = box.nextElementSibling;
    if (next && !next.classList.contains("done")) {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      next.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    }
  }));
}

function stepComplete() {
  let ok = true;
  $("#stepBody").querySelectorAll(".q").forEach(box => {
    const filled = box.dataset.q !== undefined ? state.answers[+box.dataset.q] : state.info[box.dataset.info];
    if (!filled) { ok = false; box.classList.add("missing"); box.classList.remove("done"); }
  });
  if (!ok) $("#stepBody .missing").scrollIntoView({ block: "center", behavior: "smooth" });
  return ok;
}

// 결과 화면은 다음 단계에서 만들고, 지금은 응답 완료 안내만 보여줌
function finish() {
  $("#result").innerHTML = `
    <section class="band"><div class="inner center">
      <h2>응답을 모두 마쳤어요</h2>
      <p class="muted">결과 화면은 준비 중이에요.</p>
    </div></section>`;
  show("#result");
}

$("#startBtn").addEventListener("click", () => { state.step = 0; show("#quiz"); renderStep(); });
$("#prevBtn").addEventListener("click", () => {
  if (state.step === 0) { show("#intro"); return; }
  state.step--; save(); renderStep(); window.scrollTo(0, 0);
});
$("#nextBtn").addEventListener("click", () => {
  if (!stepComplete()) return;
  if (state.step < TOTAL_STEPS - 1) { state.step++; save(); renderStep(); window.scrollTo(0, 0); }
  else finish();
});

load();

renderIntro();
</script>
</body>
</html>
