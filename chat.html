
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>룸메이트 채팅</title>

  <style>
    :root {
      --bg: #ffffff;
      --band: #eef8f4;
      --surface: #ffffff;
      --ink: #2b3340;
      --muted: #727b88;
      --line: #e3e7ec;
      --agree: #2bae7e;
      --agree-dark: #218e67;
      --font-body: "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.6;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .header {
      background: var(--band);
      padding: 34px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .container {
      max-width: 760px;
      margin: 30px auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      overflow: hidden;
    }

    .chat-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chat-name {
      font-weight: bold;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .status {
      font-size: 12px;
      color: var(--agree-dark);
      background: var(--band);
      border-radius: 999px;
      padding: 5px 12px;
      white-space: nowrap;
    }

    .messages {
      height: 360px;
      overflow-y: auto;
      padding: 20px;
      background: #fafcfb;
    }

    .empty-message {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-top: 110px;
    }

    .message {
      width: fit-content;
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    .mine {
      background: var(--agree);
      color: white;
      margin-left: auto;
    }

    .other {
      background: #e9edf0;
      margin-right: auto;
    }

    .system {
      background: #eef1f4;
      color: var(--muted);
      text-align: center;
      margin: 14px auto;
      max-width: 90%;
      font-size: 13px;
    }

    .choices {
      padding: 20px;
      border-top: 1px solid var(--line);
    }

    .choices h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .categories,
    .question-list,
    .answer-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .categories {
      margin-bottom: 20px;
    }

    .category-btn,
    .choice-btn {
      background: white;
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 15px;
      transition: background 0.15s;
    }

    .category-btn.active {
      background: var(--agree);
      color: white;
      border-color: var(--agree);
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--agree);
      color: var(--agree-dark);
    }

    .answer-area {
      margin-top: 20px;
      padding: 16px;
      background: var(--band);
      border-radius: 14px;
    }

    .answer-area h3 {
      margin: 0 0 10px;
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      margin: 10px 0 0;
    }

    .actions {
      padding: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font-weight: bold;
    }

    .accept-btn {
      background: var(--agree);
      color: white;
      border-color: var(--agree);
    }

    .accept-btn:hover:not(:disabled) {
      background: var(--agree-dark);
    }

    .end-btn:hover:not(:disabled) {
      background: #f4f5f6;
    }

    .decision-panel {
      padding: 18px;
      margin: 0 20px 20px;
      background: var(--band);
      border-radius: 14px;
      text-align: center;
    }

    .decision-panel h3 {
      margin: 0 0 8px;
    }

    .decision-panel p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .decision-buttons {
      display: flex;
      gap: 10px;
    }

    .decision-buttons button {
      flex: 1;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      .container {
        margin: 18px 12px;
      }

      .header h1 {
        font-size: 24px;
      }

      .chat-header {
        padding: 14px;
      }

      .actions,
      .decision-buttons {
        flex-direction: column;
      }

      .message {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>룸메이트 채팅</h1>
    <p>미리 준비된 문장으로 서로의 생활 습관을 알아보세요.</p>
  </header>

  <main class="container">

    <div class="chat-header">
      <div class="chat-name" id="chatName">
        룸메이트와의 채팅
      </div>
      <span class="status" id="status">연결 중</span>
    </div>

    <div class="messages" id="messages" aria-live="polite">
      <p class="empty-message">
        질문을 선택하여 대화를 시작해 보세요!
      </p>
    </div>

    <section class="choices" id="chatControls" hidden>
      <h3>대화 주제</h3>
      <div class="categories" id="categories"></div>

      <h3>보낼 메시지</h3>
      <div class="question-list" id="questionList"></div>

      <div class="answer-area" id="answerArea" hidden>
        <h3>상대방 답변 선택</h3>
        <div class="answer-list" id="answerList"></div>
        <p class="note">
          상대방이 보낸 질문에 대한 답변을 선택하세요.
        </p>
      </div>
    </section>

    <div class="actions" id="actions" hidden>
      <button class="action-btn accept-btn" id="requestBtn">
        룸메이트 채택 요청
      </button>

      <button class="action-btn end-btn" id="endBtn">
        채팅 끝내기
      </button>
    </div>

    <div class="decision-panel" id="decisionPanel" hidden>
      <h3>룸메이트 채택 요청</h3>
      <p>
        상대방에게 받은 채택 요청을 수락할지 선택해 주세요.
      </p>

      <div class="decision-buttons">
        <button class="action-btn accept-btn" id="acceptBtn">
          수락하기
        </button>

        <button class="action-btn" id="rejectBtn">
          거절하기
        </button>
      </div>
    </div>

  </main>

  <script type="module">

    import {
      requireLogin,
      openChat,
      watchChat,
      watchMessages,
      sendMessage,
      setChatStatus,
      getPost
    } from "./firebase.js";

    // 1. 채팅 질문과 답변 데이터

    const conversations = {
      "인사 및 기본 정보": [
        {
          question: "안녕하세요! 반갑습니다.",
          answers: [
            "안녕하세요! 저도 반가워요.",
            "안녕하세요! 잘 부탁드려요."
          ]
        },
        {
          question: "혹시 몇 학년이세요?",
          answers: [
            "1학년이에요.",
            "2학년이에요.",
            "3학년이에요.",
            "4학년이에요."
          ]
        },
        {
          question: "어느 생활관에 거주하시나요?",
          answers: [
            "아직 배정받지 않았어요.",
            "현재 기숙사에 거주하고 있어요.",
            "다음 학기에 입사할 예정이에요."
          ]
        }
      ],

      "생활 습관": [
        {
          question: "보통 몇 시에 주무세요?",
          answers: [
            "밤 11시 이전에 자요.",
            "12시쯤 자요.",
            "새벽 1~2시쯤 자요.",
            "날마다 달라요."
          ]
        },
        {
          question: "아침에 몇 시쯤 일어나세요?",
          answers: [
            "오전 7시 이전에 일어나요.",
            "오전 7~9시 사이에 일어나요.",
            "오전 9시 이후에 일어나요.",
            "일정에 따라 달라요."
          ]
        },
        {
          question: "주말에도 기숙사에 계세요?",
          answers: [
            "대부분 기숙사에 있어요.",
            "주말에는 본가에 가요.",
            "그때그때 달라요."
          ]
        },
        {
          question: "밤늦게까지 공부하는 편이세요?",
          answers: [
            "네, 늦게까지 공부하는 편이에요.",
            "가끔 늦게까지 공부해요.",
            "아니요, 일찍 마치는 편이에요."
          ]
        }
      ],

      "청결 및 방 관리": [
        {
          question: "청소는 얼마나 자주 하세요?",
          answers: [
            "매일 조금씩 해요.",
            "일주일에 1~2번 해요.",
            "필요할 때 해요."
          ]
        },
        {
          question: "방 정리는 자주 하시는 편인가요?",
          answers: [
            "네, 항상 깔끔하게 정리해요.",
            "가끔 정리하는 편이에요.",
            "크게 신경 쓰지 않는 편이에요."
          ]
        },
        {
          question: "방에서 음식을 먹는 편이세요?",
          answers: [
            "네, 자주 먹는 편이에요.",
            "가끔 간단한 음식만 먹어요.",
            "아니요, 방에서는 잘 먹지 않아요."
          ]
        },
        {
          question: "빨래는 얼마나 자주 하세요?",
          answers: [
            "거의 매일 해요.",
            "일주일에 1~2번 해요.",
            "빨랫감이 쌓이면 해요."
          ]
        }
      ],

      "소음 및 개인 생활": [
        {
          question: "잠잘 때 소리에 민감하신가요?",
          answers: [
            "네, 작은 소리에도 깨요.",
            "어느 정도는 괜찮아요.",
            "소리에 크게 민감하지 않아요."
          ]
        },
        {
          question: "방에서 통화를 자주 하세요?",
          answers: [
            "네, 자주 하는 편이에요.",
            "가끔 통화해요.",
            "거의 하지 않아요."
          ]
        },
        {
          question: "코골이나 잠버릇이 있으신가요?",
          answers: [
            "아니요, 거의 없어요.",
            "조금 있는 편이에요.",
            "있는 편이에요."
          ]
        },
        {
          question: "조용한 환경을 선호하시나요?",
          answers: [
            "네, 조용한 환경을 좋아해요.",
            "적당한 생활 소음은 괜찮아요.",
            "소음에 크게 신경 쓰지 않아요."
          ]
        }
      ],

      "생활 환경": [
        {
          question: "방 온도는 어느 정도가 좋으세요?",
          answers: [
            "시원한 게 좋아요.",
            "적당한 온도가 좋아요.",
            "따뜻한 게 좋아요."
          ]
        },
        {
          question: "에어컨을 자주 켜는 편이세요?",
          answers: [
            "네, 자주 켜는 편이에요.",
            "더울 때만 켜요.",
            "에어컨을 잘 켜지 않아요."
          ]
        },
        {
          question: "잘 때 불을 완전히 끄는 편이세요?",
          answers: [
            "네, 완전히 꺼야 잠이 와요.",
            "작은 조명은 괜찮아요.",
            "불빛에 크게 민감하지 않아요."
          ]
        },
        {
          question: "환기는 얼마나 자주 하세요?",
          answers: [
            "매일 환기하는 편이에요.",
            "가끔 환기해요.",
            "필요할 때만 환기해요."
          ]
        }
      ]
    };

    // 2. 로그인 및 채팅 상대 확인

    const user = await requireLogin();

    const params = new URLSearchParams(location.search);
    const otherUid = params.get("with");
    const postId = params.get("post");

    // 3. HTML 요소 가져오기

    const messagesEl = document.getElementById("messages");
    const categoriesEl = document.getElementById("categories");
    const questionListEl = document.getElementById("questionList");
    const answerAreaEl = document.getElementById("answerArea");
    const answerListEl = document.getElementById("answerList");
    const chatControlsEl = document.getElementById("chatControls");
    const actionsEl = document.getElementById("actions");
    const decisionPanelEl = document.getElementById("decisionPanel");
    const statusEl = document.getElementById("status");
    const requestBtn = document.getElementById("requestBtn");
    const endBtn = document.getElementById("endBtn");

    // 4. Firebase 채팅 상태 관리

    let chatId = null;
    let chat = null;
    let messages = [];
    let selectedCategory = "인사 및 기본 정보";
    let busy = false;

    const allQuestions = Object.values(conversations).flat();

    const questionByText = new Map(
      allQuestions.map(item => [item.question, item])
    );

    // 5. 버튼 생성

    function makeButton(text, className, handler) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = text;
      button.addEventListener("click", handler);
      return button;
    }

    // 6. 현재 답변을 기다리는 질문 확인

    function pendingQuestion() {
      const dialogue = messages.filter(
        msg => msg.type === "question" ||
               msg.type === "answer"
      );

      const last = dialogue.at(-1);

      if (!last || last.type !== "question") {
        return null;
      }

      return {
        message: last,
        item: questionByText.get(last.text)
      };
    }

    // 7. 채팅 메시지 표시

    function renderMessages() {
      messagesEl.replaceChildren();

      if (messages.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent =
          "질문을 선택하여 대화를 시작해 보세요!";

        messagesEl.appendChild(empty);
        return;
      }

      messages.forEach(msg => {
        const bubble = document.createElement("div");

        bubble.className = "message " + (
          msg.type === "system"
            ? "system"
            : msg.mine ? "mine" : "other"
        );

        bubble.textContent = msg.text;
        messagesEl.appendChild(bubble);
      });

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // 8. 대화 주제 표시

    function renderCategories() {
      categoriesEl.replaceChildren();

      Object.keys(conversations).forEach(category => {
        const active = category === selectedCategory;

        const button = makeButton(
          category,
          "category-btn" + (active ? " active" : ""),
          () => {
            selectedCategory = category;
            renderCategories();
            renderQuestions();
          }
        );

        categoriesEl.appendChild(button);
      });
    }

    // 9. 질문 선택지 표시

    function renderQuestions() {
      questionListEl.replaceChildren();

      const waiting = Boolean(pendingQuestion());
      const items = conversations[selectedCategory] || [];

      items.forEach(item => {
        const button = makeButton(
          item.question,
          "choice-btn",
          () => sendQuestion(item)
        );

        button.disabled =
          busy || waiting || chat?.status !== "chatting";

        questionListEl.appendChild(button);
      });
    }

    // 10. 답변 선택지 표시

    function renderAnswerChoices() {
      answerListEl.replaceChildren();

      const pending = pendingQuestion();

      const canAnswer =
        chat?.status === "chatting" &&
        pending &&
        pending.message.senderId !== user.uid &&
        pending.item;

      answerAreaEl.hidden = !canAnswer;

      if (!canAnswer) return;

      pending.item.answers.forEach(answer => {
        const button = makeButton(
          answer,
          "choice-btn",
          () => sendAnswer(answer)
        );

        button.disabled = busy;
        answerListEl.appendChild(button);
      });
    }

    // 11. 현재 채팅 상태에 따라 화면 변경

    function renderUI() {
      renderMessages();

      const status = chat?.status;
      const chatting = status === "chatting";
      const requested = status === "requested";

      const recipient =
        requested && chat.requestedBy !== user.uid;

      chatControlsEl.hidden = !chatting;
      actionsEl.hidden = !chatting && !requested;

      requestBtn.hidden = !chatting;
      requestBtn.disabled = busy;
      endBtn.disabled = busy;

      decisionPanelEl.hidden = !recipient;

      document.getElementById("acceptBtn").disabled = busy;
      document.getElementById("rejectBtn").disabled = busy;

      if (!chat) {
        statusEl.textContent = "연결 중";
      } else if (chatting) {
        statusEl.textContent = "대화 중";
      } else if (requested) {
        statusEl.textContent = "채택 요청 대기 중";
      } else if (status === "matched") {
        statusEl.textContent = "매칭 완료";
      } else {
        statusEl.textContent = "채팅 종료";
      }

      renderCategories();
      renderQuestions();
      renderAnswerChoices();
    }

    // 12. Firebase 작업 실행 및 오류 처리

    async function runAction(action) {
      if (busy) return;

      busy = true;
      renderUI();

      try {
        await action();
      } catch (error) {
        console.error(error);
        alert(
          "작업에 실패했습니다: " +
          (error?.message || "알 수 없는 오류")
        );
      } finally {
        busy = false;
        renderUI();
      }
    }

    // 13. 질문 보내기

    function sendQuestion(item) {
      if (
        busy ||
        chat?.status !== "chatting" ||
        pendingQuestion()
      ) return;

      runAction(async () => {
        await sendMessage(
          chatId,
          item.question,
          "question"
        );
      });
    }

    // 14. 상대방 질문에 답변하기

    function sendAnswer(answer) {
      const pending = pendingQuestion();

      if (
        busy ||
        chat?.status !== "chatting" ||
        !pending ||
        pending.message.senderId === user.uid ||
        !pending.item?.answers.includes(answer)
      ) return;

      runAction(async () => {
        await sendMessage(
          chatId,
          answer,
          "answer"
        );
      });
    }

    // 15. 룸메이트 채택 요청

    function requestMatching() {
      if (busy || chat?.status !== "chatting") return;

      if (pendingQuestion()) {
        alert("진행 중인 질문에 대한 답변을 기다려 주세요.");
        return;
      }

      const confirmed = confirm(
        "상대방에게 룸메이트 채택을 요청할까요?"
      );

      if (!confirmed) return;

      runAction(async () => {
        await sendMessage(
          chatId,
          "룸메이트 채택 요청을 보냈습니다.",
          "system"
        );

        await setChatStatus(chatId, "requested");
      });
    }

    // 16. 룸메이트 채택 수락

    function acceptMatching() {
      if (
        busy ||
        chat?.status !== "requested" ||
        chat.requestedBy === user.uid
      ) return;

      runAction(async () => {
        await sendMessage(
          chatId,
          "상대방이 채택 요청을 수락했습니다. " +
          "룸메이트 매칭이 완료되었습니다!",
          "system"
        );

        await setChatStatus(chatId, "matched");
      });
    }

    // 17. 룸메이트 채택 거절

    function rejectMatching() {
      if (
        busy ||
        chat?.status !== "requested" ||
        chat.requestedBy === user.uid
      ) return;

      runAction(async () => {
        await sendMessage(
          chatId,
          "상대방이 채택 요청을 거절했습니다. " +
          "대화는 계속할 수 있습니다.",
          "system"
        );

        await setChatStatus(chatId, "chatting");
      });
    }

    // 18. 채팅 종료

    function endChat() {
      if (
        busy ||
        !chat ||
        chat.status === "ended" ||
        chat.status === "matched"
      ) return;

      const confirmed = confirm(
        "채팅을 종료하시겠습니까?\n" +
        "종료 후에는 메시지를 보낼 수 없습니다."
      );

      if (!confirmed) return;

      runAction(async () => {
        await sendMessage(
          chatId,
          "채팅이 종료되었습니다.",
          "system"
        );

        await setChatStatus(chatId, "ended");
      });
    }

    // 19. 버튼에 기능 연결

    requestBtn.addEventListener(
      "click",
      requestMatching
    );

    document.getElementById("acceptBtn")
      .addEventListener("click", acceptMatching);

    document.getElementById("rejectBtn")
      .addEventListener("click", rejectMatching);

    endBtn.addEventListener(
      "click",
      endChat
    );

    // 20. Firebase 채팅방 연결

    if (!otherUid) {
      statusEl.textContent = "상대방 정보 없음";

      alert(
        "채팅 상대 정보가 없습니다.\n" +
        "추천 또는 게시판에서 채팅하기를 눌러 주세요."
      );
    } else {
      try {
        const post = postId
          ? await getPost(postId)
          : null;

        chatId = await openChat(
          otherUid,
          postId,
          post?.authorName || ""
        );

        watchChat(chatId, value => {
          chat = value;

          document.getElementById("chatName").textContent =
            (chat?.names?.[otherUid] || "룸메이트") +
            "님과의 채팅";

          renderUI();
        });

        watchMessages(chatId, value => {
          messages = value;
          renderUI();
        });

      } catch (error) {
        console.error(error);

        statusEl.textContent = "연결 실패";
        chatControlsEl.hidden = true;
        actionsEl.hidden = true;

        alert(
          "채팅방을 열 수 없습니다: " +
          (error?.message || "알 수 없는 오류")
        );
      }
    }

  </script>
</body>
</html>
